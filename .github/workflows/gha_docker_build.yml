name: GHAction build docker container and push to ghcr.io

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  ci_step:
    name: Build, tag and push Docker image to DockerHub
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # allows pushing to GHCR
      security-events: write # allows uploading SARIF results

    steps:
      - name: Check out the source_repo
        uses: actions/checkout@v6

      - name: QEMU set-up
        uses: docker/setup-qemu-action@v4

      - name: Buildx set-up
        uses: docker/setup-buildx-action@v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}:${{ github.sha }}
          tags: |
            type=sha
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image for scanning
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
          load: true

      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository }}:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "1" # fails the job if vulnerabilities found

      - name: Upload Trivy results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: Build only for scanning
        uses: docker/build-push-action@v5
        with:
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: scan-target:latest
          cache-from: |
            type=registry,ref=ghcr.io/${{ github.repository }}:cache

      - name: Build and push to ghcr.io
        uses: docker/build-push-action@v5
        with:
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: |
            type=registry,ref=ghcr.io/${{ github.repository }}:cache
          cache-to: |
            type=registry,ref=ghcr.io/${{ github.repository }}:cache,mode=max
          tags: ${{ steps.meta.outputs.tags }}
